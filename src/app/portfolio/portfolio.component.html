
<section class="section pointer" id="portfolio">
    <div class="container">

        <div class="row justify-content-center txt-bg txt-bg-portfolio">
            <div class="col-lg-6">
                <div class="wow fadeIn section-title text-center mb-4 pb-2">

                    <div class="mb-5 pb-3">
                        <i class="far fa-clone h1 text-muted"></i>
                    </div>

                    <h2 class="h3 font-weight-bold">My Portfolio</h2>

                    <p class="text-muted mx-auto mb-0 mt-4 para-desc">
                        Projects I have worked on.
                    </p>

                </div>
            </div>
        </div>

        <div class="row container-grid mt-4 pt-2">

            <div *ngFor="let project of portfolioData"
                class="wow {{project['animationClass']}} col-lg-4 spacing"
                [attr.data-wow-delay]="project['delay']">

                <div class="card h-100 text-center p-4">

                    <div class="mb-3">
                        <i class="fas fa-lightbulb fa-3x text-muted"></i>
                    </div>

                    <h3 class="h5 font-weight-bold">
                        {{project['project']}}
                    </h3>

                    <p class="text-muted">
                        {{project['description']}}
                    </p>

                </div>

            </div>

        </div>
    </div>
</section>
